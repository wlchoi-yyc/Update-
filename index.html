<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>網站維護中</title>
  <style>
    body {
      background-color: #f9f9f9;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    h1 {
      font-size: 48px;
      color: #333;
      margin-bottom: 20px;
    }

    p {
      font-size: 24px;
      color: #666;
      margin-bottom: 50px;
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .cat {
      width: 150px;
      position: absolute;
      bottom: 50px;
      animation: runAcross 5s linear infinite;
    }

    @keyframes runAcross {
      0% { left: -160px; }
      100% { left: 110%; }
    }
  </style>
</head>
<body>
  <h1>網站維護中</h1>
  <p>請稍後再來...</p>
  <img class="cat" src="running_cat.gif" alt="小貓跑步">
</body>
</html>
